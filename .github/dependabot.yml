version: 2

updates:
  # Python dependencies (uv/pip ecosystem)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      # Batch minor/patch updates to reduce PR noise
      python-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # cryptography capped by pan-scm-sdk==0.15.1 at <50.0.0 — re-check this
      # cap whenever pan-scm-sdk is upgraded; tracked in soc2-controls.yaml
      - dependency-name: cryptography
        versions: [">=50.0.0"]
      # setuptools capped by pan-scm-sdk==0.15.1 at <79.0.0 — verified forcing
      # a newer setuptools breaks resolution against pan-scm-sdk's wheel
      # metadata. GHSA-h35f-9h28-mq5c / CVE-2026-59890 (PYSEC-2026-3447) fixed
      # in 83.0.0 is suppressed in CI (security-scan.yml) pending an upstream
      # SDK release; re-check this cap whenever pan-scm-sdk is upgraded.
      - dependency-name: setuptools
        versions: [">=79.0.0"]
      # oauthlib capped by pan-scm-sdk==0.15.1 at <4.0.0. CVE-2026-49265
      # (PYSEC-2026-4114), fixed in 4.0.0, is a server-side PKCE timing leak
      # unreachable from our client-credentials flow; suppressed in CI
      # (security-scan.yml). Re-check this cap whenever pan-scm-sdk is upgraded.
      - dependency-name: oauthlib
        versions: [">=4.0.0"]
    labels:
      - dependencies
      - python

  # GitHub Actions
  #
  # Every `uses:` in .github/workflows is pinned to a full 40-character commit
  # SHA, with the human-readable version in a trailing comment. Dependabot
  # reads that comment, so it still raises version-bump PRs and rewrites both
  # the SHA and the comment together — pinning does not freeze us.
  #
  # Tag pins are NOT sufficient and were not left in place deliberately. In the
  # TeamPCP compromise of aquasecurity/trivy-action (19 Mar 2026, GHSA-69fq-
  # xp46-6x23) the attacker force-pushed 76 of 77 version tags to malicious
  # commits, so `@v0.34.2` silently became attacker-controlled. A commit SHA is
  # the only ref that cannot be moved under us. Keep it that way: review the
  # diff of a Dependabot actions PR before merging, because the whole point is
  # that the new SHA is the thing being trusted.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions
      - supply-chain

  # Docker base images (python:3.12-slim, the uv image) are pinned by digest in
  # the Dockerfile for the same reason: a tag can be repointed, a digest can't.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
      - supply-chain
