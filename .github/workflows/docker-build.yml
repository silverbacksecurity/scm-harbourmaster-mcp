name: Docker Build

on:
  push:
    branches: [master, main]
    tags: ['v*.*.*']
  pull_request:
    branches: [master, main]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      # Build once into the local daemon and run it before anything is pushed.
      # The image used to ship an empty venv, and CI never noticed because it
      # only built it.
      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: scm-mcp-smoke:ci
          cache-from: type=gha
          platforms: linux/amd64

      - name: Smoke test image
        run: |
          set -euo pipefail
          img=scm-mcp-smoke:ci
          # Every data directory is writable as the runtime user
          docker run --rm "$img" python -c "from scm_harbourmaster_mcp.utils import paths; [(f().mkdir(parents=True, exist_ok=True), (f() / 'probe').write_text('ok')) for f in (paths.backup_dir, paths.baseline_dir, paths.reports_dir, paths.logs_dir, paths.plan_dir, paths.index_dir)]"
          # stdio: initialize + tools/list on a hardened, read-only container.
          # stdin stays open (sleep) until the reply is read: on EOF the server
          # exits and can drop a request it hasn't answered yet.
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 20; } \
            | timeout 60 docker run --rm -i --read-only --tmpfs /tmp --cap-drop ALL \
                --security-opt no-new-privileges \
                -v "$PWD/settings.example.toml:/data/settings.toml:ro" "$img" 2>stdio.err \
            | python3 -c "$(printf '%s\n' \
                'import json, sys' \
                'for line in sys.stdin:' \
                '    msg = json.loads(line)' \
                '    if msg.get("id") == 2:' \
                '        n = len(msg["result"]["tools"])' \
                '        print(f"tools/list: {n} tools")' \
                '        sys.exit(n == 0)' \
                'sys.exit("no tools/list reply")')" \
            || { echo "--- server stderr ---"; cat stdio.err; exit 1; }
          # HTTP: /health answers, unauthenticated MCP is refused, SIGTERM is honoured
          docker run -d --name smoke-http -p 18080:8080 -e SCM_MCP_HTTP_API_KEY=ci-smoke "$img" scm-mcp-http
          for i in $(seq 1 30); do curl -sf localhost:18080/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 localhost:18080/sse)" = 401
          timeout 10 docker stop -t 8 smoke-http
          docker rm smoke-http

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Scan image for vulnerabilities (Trivy)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
