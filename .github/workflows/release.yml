name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write  # needed for PyPI trusted publishing

jobs:
  release:
    name: Build, publish, and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest

      # ── Run full test suite before releasing ─────────────────────────────
      - name: Run tests
        run: uv sync --all-groups && uv run pytest
        env:
          SCM_MCP_SCM_TENANT_ID: "test-tenant"
          SCM_MCP_SCM_CLIENT_ID: "test@iam"
          SCM_MCP_SCM_CLIENT_SECRET: "test-secret"

      # ── Build Python distribution ─────────────────────────────────────────
      - name: Build wheel and sdist
        run: uv build

      # ── Publish to PyPI via trusted publishing ────────────────────────────
      # Configure PyPI trusted publisher at:
      # https://pypi.org/manage/account/publishing/
      # Publisher: GitHub Actions | repo: silverbacksecurity/scm-mcp-mssp
      # continue-on-error so a missing/misconfigured trusted publisher does not
      # block the Docker image and GitHub Release that follow.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        continue-on-error: true
        with:
          skip-existing: true

      # ── Generate SBOM (CycloneDX) ─────────────────────────────────────────
      # The cyclonedx-bom package ships the `cyclonedx-py` entry point, which
      # takes the requirements file as a positional arg. continue-on-error so a
      # SBOM hiccup never blocks the image + GitHub Release.
      - name: Generate SBOM
        continue-on-error: true
        run: |
          uv export --no-dev --format requirements-txt | grep -v "^-e " > sbom-requirements.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements sbom-requirements.txt \
            --of JSON -o sbom-${{ github.ref_name }}.cdx.json

      # ── Build and push Docker image ───────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push release image (full)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: full
          push: true
          # Fresh Chromium from Debian on every release (see docker-build.yml).
          no-cache-filters: full
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-full
            ghcr.io/${{ github.repository }}:latest-full
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full

      # ── Create GitHub Release with artifacts ─────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom-${{ github.ref_name }}.cdx.json
