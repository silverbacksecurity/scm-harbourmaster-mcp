# Everything below runs at commit time by default; only public-leak-guard
# below overrides this to run at push time instead.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # Secret scanning — catches credentials before they hit git history
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Python SAST — blocks HIGH/CRITICAL security findings in src/
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, src/, -ll]
        pass_filenames: false

  # Dependency vulnerability check on every commit
  - repo: https://github.com/pypa/pip-audit
    rev: v2.9.0
    hooks:
      - id: pip-audit
        args: [--skip-editable]
        # pip-audit scans its own isolated hook venv, so the pip that
        # pre-commit seeds there shows up as a finding. Patch it rather than
        # suppress it: pip < 26.2 mishandles doubly-encoded package URLs from
        # an index and can write files to arbitrary paths (CVE-2026-13346 /
        # PYSEC-2026-3721). Not a project dependency — pip is not in
        # pyproject.toml or uv.lock. Same for urllib3, which pip-audit pulls
        # in through requests: < 2.8.0 hits PYSEC-2026-4175/4176/4177 (the
        # project's own urllib3 is pinned in uv.lock).
        additional_dependencies: ["pip>=26.2", "urllib3>=2.8.0"]

  # Block pushes to the public mirror (`pub` remote) that contain
  # tenant-identifying content — gitleaks catches secrets, not customer
  # names, which is how the 2026-07-13 leak slipped through.
  - repo: local
    hooks:
      - id: public-leak-guard
        name: Block tenant identifiers from reaching the public mirror
        entry: uv run python scripts/check_public_leak.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
