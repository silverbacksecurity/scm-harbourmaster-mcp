[project]
name = "scm-harbourmaster-mcp"
dynamic = ["version"]
description = "MCP server for Palo Alto Networks Strata Cloud Manager — MSSP multi-tenant edition"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "silverbacksec" }]
keywords = ["palo-alto", "scm", "strata-cloud-manager", "mcp", "mssp", "network-security"]
dependencies = [
    "dynaconf>=3.2.13",
    "markdown>=3.10.2",
    "mcp>=1.28.1,<2",
    "pan-scm-sdk>=0.15.1",
    "prisma-sase>=6.8.1b1",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    "PyJWT>=2.0",
    "anthropic>=0.113.0",
    "python-docx>=1.2.0",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "uvicorn>=0.29.0",
    "pypandoc-binary>=1.17",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
]

[project.scripts]
scm-mcp = "scm_harbourmaster_mcp.server:main"
scm-mcp-http = "scm_harbourmaster_mcp.server_http:main"
scm-mcp-cli = "scm_harbourmaster_mcp.cli:main"
scm-planner-nightly = "scm_harbourmaster_mcp.planner.nightly:main"
scm-planner-estate = "scm_harbourmaster_mcp.planner.estate:main"

[dependency-groups]
dev = [
    "hatch-vcs>=0.5.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
    "ruff>=0.15.17",
    "types-jsonschema>=4.20",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/scm_harbourmaster_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scm_harbourmaster_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/scm_harbourmaster_mcp/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_configs = true
warn_unused_ignores = false

# cli_menus.py is interactive menu plumbing exec'd into cli.py's namespace;
# its ~90 _op_/_menu_ handlers take injected console/helper params where
# annotations add churn without safety. Bodies are still type-checked.
[[tool.mypy.overrides]]
module = "scm_harbourmaster_mcp.cli_menus"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Remaining type-check debt: asbuilt_report (5382-line report builder) still has
# ~16 errors to work through. All other modules are now fully type-checked.
[[tool.mypy.overrides]]
module = [
    "scm_harbourmaster_mcp.audit.asbuilt_report",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/scm_harbourmaster_mcp --cov-report=term-missing"
markers = [
    "integration: offline recorded-response (cassette) tests that drive registered tools through the real HTTP stack; no credentials or network needed, so they run by default",
]

[tool.coverage.run]
source = ["src/scm_harbourmaster_mcp"]
omit = ["*/tests/*"]
