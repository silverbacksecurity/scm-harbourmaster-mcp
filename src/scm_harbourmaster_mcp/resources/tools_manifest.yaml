# Planner Agent tool manifest — one entry per registered MCP tool.
#
# Safety rail: access: write tools ALWAYS require explicit human approval
# before execution, regardless of trigger type. The loader
# (scm_harbourmaster_mcp.planner.manifest) exposes no way to disable this in v1.
#
# Regenerate/verify coverage: tests/unit/test_planner_manifest.py fails
# whenever a registered tool lacks an entry here (or vice versa).
# Tools: 170 | write: 30 | domains: 11

dlp_backup:
  access: read
  domain: dlp
  idempotent: true
  retry_policy: retry
  scope: tenant
dlp_enterprise_list:
  access: read
  domain: dlp
  idempotent: true
  retry_policy: retry
  scope: tenant
