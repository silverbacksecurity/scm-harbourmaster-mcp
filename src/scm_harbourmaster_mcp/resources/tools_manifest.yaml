  access: read
  domain: operational_health
  scope: tenant
  idempotent: true
  retry_policy: retry
  known_failure_modes: 'Generic ADEM telemetry query surface over 13 views -
    a 401 usually means the tenant lacks the ADEM entitlement or the service
    account lacks the adem OAuth scope, not a bad token. Per-view parameter
    support (endpoint-type, response-type enums, filter requirements) varies
    across endpoints; agent_properties and route_hops need a filter naming a
    real agent_uuid/site_id/probe_uuid or they 400.'
